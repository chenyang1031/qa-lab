services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: demo_shop
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot123"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8001:8000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
