# 应用:Deployment(带等库启动的 initContainer)+ NodePort Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ["sh", "-c", "until nc -z db 3306; do echo waiting for db; sleep 2; done"]
      containers:
      - name: app
        image: demo-shop-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: db
        - name: DB_PORT
          value: "3306"
        - name: REDIS_URL
          value: redis://redis:6379/0
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
spec:
  type: NodePort
  selector:
    app: demo-app
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
