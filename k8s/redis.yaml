# 缓存:Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-redis
  template:
    metadata:
      labels:
        app: demo-redis
    spec:
      containers:
      - name: redis
        image: redis:7
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: demo-redis
  ports:
  - port: 6379
    targetPort: 6379
